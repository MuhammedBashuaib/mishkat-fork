name: mishkat_app
description: تطبيق مشكاة للقرآن والأذكار ومواقيت الصلاة والقبلة.
publish_to: none
version: 1.3.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audio_session: ^0.2.4
  connectivity_plus: ^7.0.0
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.1.1
  flutter_svg: ^2.2.3
  geolocator: ^14.0.2
  intl: ^0.20.2
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  path_provider: ^2.1.5
  provider: ^6.1.2
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  wakelock_plus: ^1.8.0
  speech_to_text: ^7.5.0
  geomag: ^0.3.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/mushaf/pages/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
